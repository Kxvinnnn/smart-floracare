; =============================================================================
; ARCHIVO DE CONFIGURACIÓN DE PLATFORMIO (AUDITORÍA TÉCNICA)
; Proyecto: Smart FloraCare - Regador Automático Inteligente
; =============================================================================

[platformio]
default_envs = nanoatmega328
src_dir = src
include_dir = include

; --- ENTORNO 1: ARDUINO NANO (ATmega328P, 5V, 16MHz) ---
[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_src_filter = 
    -<*>
    +<arduino_nano_mejorado/*>
build_flags = 
    -Wall
    -Wextra
    -Werror=return-type
    -D ARDUINO_NANO_BUILD
    -I include
lib_deps = 
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    Wire

; --- ENTORNO 2: ESP32 DEVKIT V1 (Xtensa Dual-Core 3.3V, WiFi) ---
[env:esp32dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = 
    -<*>
    +<esp32_mejorado_wifi/*>
build_flags = 
    -Wall
    -Wextra
    -D ESP32_BUILD
    -I include
lib_deps = 
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    Wire

; --- ENTORNO 3 (SOLO BANCO ACT-06.A2): ARDUINO NANO WATCHDOG AISLADO 25S ---
[env:nanoatmega328_bench_wdt25s]
extends = env:nanoatmega328
build_flags = 
    ${env:nanoatmega328.build_flags}
    -D FLORACARE_BENCH_TEST_WATCHDOG_25S

; --- ENTORNO 4 (SOLO BANCO ACT-06.A2): ESP32 WATCHDOG AISLADO 25S ---
[env:esp32dev_bench_wdt25s]
extends = env:esp32dev
build_flags = 
    ${env:esp32dev.build_flags}
    -D FLORACARE_BENCH_TEST_WATCHDOG_25S
