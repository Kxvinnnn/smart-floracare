name: Smart FloraCare CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install platformio requests

      - name: Run Domain & FSM Unit Test Suite
        run: |
          python tests/test_irrigation_suite.py

      - name: Compile Arduino Nano Environment (nanoatmega328)
        run: |
          pio run -e nanoatmega328

      - name: Compile ESP32 Environment (esp32dev)
        run: |
          pio run -e esp32dev
